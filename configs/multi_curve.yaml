# Multi-curve model (stage 4): up to 16 cubics per 64x64 patch, DETR-style set
# prediction with Hungarian matching. ~150k steps (about 4.5 h on an RTX 5070).
# Target machine: Ryzen 7 9700X (8C/16T) + RTX 5070 (12 GB); every run stops
# at 36 h and continues with --resume.
name: m3
task: multi_curve
seed: 0
data:
  patch_size: 64
  kind: hard
  clean_fraction: 0.25
model:
  channels: [32, 64, 128, 256]
  blocks: 2
  d_model: 256
  heads: 8
  enc_layers: 2
  dec_layers: 4
  queries: 16
  ff: 1024
train:
  steps: 150000
  batch_size: 128
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 2000
  grad_clip: 0.5
  amp: bf16
  num_workers: 7
  log_every: 200
  eval_every: 5000
  val_samples: 1000
  checkpoint_minutes: 30
  max_wall_hours: 36
