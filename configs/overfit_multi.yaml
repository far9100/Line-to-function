# Quick self-check for the multi-curve model: memorize 32 fixed patches.
name: overfit_multi
task: multi_curve
seed: 0
data:
  patch_size: 64
  kind: hard
  overfit_samples: 32
model:
  queries: 16
train:
  steps: 1500
  batch_size: 32
  lr: 5.0e-4
  warmup_steps: 100
  num_workers: 0
  log_every: 100
  eval_every: 500
check:
  min_f1: 0.9
