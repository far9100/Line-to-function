# Single-curve model (stage 3): one cubic per 64x64 patch, hard degradations.
# Target machine: Ryzen 7 9700X (8C/16T) + RTX 5070. Data generation runs in
# 6 worker processes; the GPU is not the bottleneck for this small network.
name: single
task: single_curve
seed: 0
data:
  patch_size: 64
  kind: hard
  clean_fraction: 0.25
model:
  channels: [32, 64, 128, 256]
  blocks: 2
  hidden: 512
train:
  steps: 30000
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 500
  amp: bf16
  num_workers: 6
  log_every: 100
  eval_every: 2000
  val_samples: 2000
  checkpoint_minutes: 30
  max_wall_hours: 36
