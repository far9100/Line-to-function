# Quick self-check: memorize 64 fixed samples. A healthy setup ends well under
# 1 px mean error in a few minutes (CPU works too, just slower).
name: overfit
task: single_curve
seed: 0
data:
  patch_size: 64
  kind: hard
  overfit_samples: 64
train:
  steps: 600
  batch_size: 64
  lr: 2.0e-3
  warmup_steps: 50
  num_workers: 0
  log_every: 50
  eval_every: 200
check:
  max_mean_px: 1.0
