# The online page: test line2func, build the page (python -m line2func.website) and publish it with GitHub
# Pages. It needs Settings -> Pages -> Source: "GitHub Actions" in the repository.
name: Online page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # the numpy, SciPy and Pillow versions the browser gets from Pyodide
      - run: python -m pip install -e ".[dev]" -c tests/pyodide/constraints.txt
      - run: npm ci --prefix tests/pyodide
      # the golden digests are recorded on Windows; the engine is also tested in Pyodide (WebAssembly)
      - run: python -m pytest -q --ignore=tests/test_golden.py
        env:
          LINE2FUNC_PYODIDE: "1"
      - run: python -m line2func.website --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
