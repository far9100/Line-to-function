<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line2func viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d9480f'/%3E%3Cpath d='M6 25C9 5 23 5 26 25' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  // A file dropped anywhere must never navigate this window away (an app window has no Back
  // button). app.js adds the real handlers; this guard works even if a module fails to load.
  addEventListener("dragover", function (e) { e.preventDefault(); });
  addEventListener("drop", function (e) { e.preventDefault(); });
</script>
<script type="module" src="app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f3; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #e2e2de; --border-strong: #c9c9c3;
    --canvas: #e9e9e5; --paper: #ffffff; --accent: #d9480f; --accent-text: #ffffff; --hover: #1c7ed6;
    --halo: rgba(255, 255, 255, 0.9); --row-hover: #f0f0ec; --row-active: #fff1e8; --danger: #c92a2a;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei UI", "PingFang TC", "Noto Sans TC", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2; --border: #2f2f34; --border-strong: #45454c;
      --canvas: #101012; --paper: #1b1b1e; --accent: #ff7a3d; --accent-text: #1a0d05; --hover: #4dabf7;
      --halo: rgba(0, 0, 0, 0.85); --row-hover: #26262a; --row-active: #33241c; --danger: #ff6b6b;
    }
  }
  [hidden] { display: none !important; }
  html[data-mode="static"] [data-app-only] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px 14px; padding: 8px 16px; min-height: 48px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 650; letter-spacing: -0.01em; }
  .muted, .hint { color: var(--muted); }
  #file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .spacer { flex: 1; }
  button, .btn, select {
    font: inherit; color: var(--text); background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  select { background: var(--panel); }
  button:hover, .btn:hover { background: var(--row-hover); }
  button:disabled, select:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.primary:hover { filter: brightness(1.06); background: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--hover); outline-offset: 1px; }
  .lang { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .lang button { border: 0; border-radius: 0; padding: 4px 10px; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  input[type=range], input[type=checkbox] { accent-color: var(--accent); }
  main { flex: 1; min-height: 0; position: relative; display: flex; }
  .screen { flex: 1; min-width: 0; min-height: 0; display: flex; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- the viewer ---------- */
  #result { flex-direction: column; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  #stats { color: var(--muted); font-variant-numeric: tabular-nums; }
  .group { display: inline-flex; gap: 4px; align-items: center; }
  #bg-alpha { width: 80px; }
  .warn { color: var(--accent); font-size: 12px; }
  #banner { padding: 6px 16px; background: var(--row-active); border-bottom: 1px solid var(--border); }
  .banner-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 2px 0; }
  .viewer { flex: 1; min-height: 0; display: flex; }
  #stage { position: relative; flex: 1; min-width: 0; background: var(--canvas); overflow: hidden; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  #canvas.over { cursor: pointer; }
  #tip {
    position: absolute; pointer-events: none; display: none; max-width: min(520px, 90%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: 12px/1.45 var(--mono); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  }
  #message {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); padding: 24px; text-align: center;
  }
  aside {
    width: 380px; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-left: 1px solid var(--border);
  }
  #detail { padding: 12px 16px; border-bottom: 1px solid var(--border); min-height: 96px; }
  #detail h2 { font-size: 14px; margin: 0 0 6px; }
  #detail .eq { font: 12.5px/1.6 var(--mono); overflow-wrap: anywhere; }
  #detail .fns { max-height: 9.6em; overflow-y: auto; } /* a curve's functions: six lines, then scroll */
  #detail .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #detail .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #list { position: relative; flex: 1; overflow-y: auto; }
  #spacer { position: relative; }
  .row {
    position: absolute; left: 0; right: 0; height: 68px; padding: 6px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer; overflow: hidden;
  }
  .row:hover { background: var(--row-hover); }
  .row.active { background: var(--row-active); }
  .row-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
  .row .eq { font: 12px/1.5 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

  /* ---------- no image yet: the drop zone; an image to convert: the convert bar ---------- */
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
  .dropzone {
    width: min(560px, 100%); padding: 36px 24px; text-align: center; background: var(--panel);
    border: 2px dashed var(--border-strong); border-radius: 16px;
  }
  .dropzone svg { width: 52px; height: 52px; color: var(--accent); }
  .dropzone h1 { font-size: 22px; margin: 10px 0 6px; font-weight: 650; }
  .dropzone p { margin: 8px 0; }
  .dropzone .primary { padding: 7px 18px; font-size: 15px; }
  #convert-bar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
  }
  .convert-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .convert-row + .convert-row { margin-top: 8px; }
  #denoise, #faint { width: 180px; }
  #denoise-value, #faint-value { min-width: 5em; color: var(--muted); font-variant-numeric: tabular-nums; }
  #convert { padding: 6px 16px; }
  #convert-note { margin: 6px 0 0; font-size: 12px; max-width: 640px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: inline-block; border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip input:focus-visible + span { outline: 2px solid var(--hover); outline-offset: 1px; }

  /* ---------- converting ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(2px);
  }
  .overlay .panel {
    width: min(430px, 92%); background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
  }
  .overlay h2 { font-size: 17px; margin: 0 0 4px; }
  #steps { list-style: none; margin: 14px 0; padding: 0; }
  #steps li { display: flex; gap: 10px; align-items: center; padding: 3px 0; color: var(--muted); }
  #steps li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border-strong); flex: none; }
  #steps li.active { color: var(--text); font-weight: 600; }
  #steps li.active::before { border-color: var(--accent); background: var(--accent); animation: pulse 1s ease-in-out infinite alternate; }
  #steps li.done { color: var(--text); }
  #steps li.done::before { border-color: var(--accent); background: var(--accent); }
  @keyframes pulse { from { opacity: 0.35; } to { opacity: 1; } }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar .fill {
    height: 100%; width: 0; background: var(--accent); transition: width 0.4s;
    background-image: linear-gradient(45deg, rgba(255,255,255,.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.25) 50%, rgba(255,255,255,.25) 75%, transparent 75%);
    background-size: 16px 16px; animation: stripes 0.8s linear infinite;
  }
  @keyframes stripes { to { background-position: 16px 0; } }
  .run-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }

  /* ---------- always present ---------- */
  #drop-overlay {
    position: fixed; inset: 0; z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 14%, transparent); border: 3px dashed var(--accent);
    font-size: 22px; font-weight: 650; color: var(--text);
  }
  #drop-overlay div { background: var(--panel); padding: 14px 22px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18); }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; max-width: min(640px, 92%);
    background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  }
  #toast.error { background: var(--danger); color: #fff; }
  #fatal { position: fixed; z-index: 70; }

  @media (max-width: 860px) {
    .viewer { flex-direction: column; }
    aside { width: auto; height: 42vh; border-left: 0; border-top: 1px solid var(--border); }
    header, .toolbar { padding: 6px 12px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">line2func</span>
  <span id="file-name" class="muted" data-app-only hidden></span>
  <button type="button" id="clear" data-app-only hidden data-i18n="result.clear" data-i18n-title="result.clearTitle">Clear image</button>
  <span class="spacer"></span>
  <div class="lang" role="group" data-i18n-aria-label="lang.label" aria-label="Language">
    <button type="button" data-lang="zh-TW" lang="zh-TW" aria-pressed="false">中文</button>
    <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
  </div>
  <button type="button" id="quit" data-app-only data-i18n="app.quit" data-i18n-title="app.quitTitle">Quit</button>
</header>

<main>
  <!-- the one screen: the curve viewer. In the app (python -m line2func) it shows a drop zone while there is
       no image and a convert bar for a dropped one; python -m line2func.serve shows a saved result in it -->
  <section id="result" class="screen">
    <div class="toolbar">
      <span id="stats"></span>
      <span class="spacer"></span>
      <button type="button" id="fit" data-i18n="result.fit" data-i18n-title="result.fitTitle">Fit</button>
      <label class="inline" data-i18n-title="result.originalOnlyTitle">
        <input type="checkbox" id="original-only"><span data-i18n="result.originalOnly">Original</span></label>
      <select id="view-mode" data-i18n-aria-label="result.view" data-i18n-title="result.view" aria-label="Display">
        <option value="lines" data-i18n="view.lines">Lines only</option>
        <option value="original" data-i18n="view.original">Lines + original</option>
        <option value="missed" data-i18n="view.missed">Lines + missed detail</option>
      </select>
      <input type="range" id="bg-alpha" min="0" max="100" value="35" data-i18n-aria-label="result.opacity" data-i18n-title="result.opacity" aria-label="Background opacity">
      <span class="group" role="group" data-i18n-aria-label="result.download" aria-label="Download">
        <button type="button" data-file="out.svg" data-i18n-title="dl.svgTitle">SVG</button>
        <button type="button" data-file="curves.json" data-i18n-title="dl.jsonTitle">JSON</button>
        <button type="button" data-file="desmos.txt" data-i18n-title="dl.desmosTitle">Desmos</button>
        <button type="button" data-file="equations.tex" data-i18n-title="dl.latexTitle">LaTeX</button>
        <button type="button" data-file="zip" data-app-only data-i18n-title="dl.zipTitle">ZIP</button>
      </span>
      <button type="button" id="copy-all" data-i18n="result.copyAll" data-i18n-title="result.copyAllTitle">Copy all for Desmos</button>
    </div>
    <div id="banner" role="status" hidden></div>
    <div class="viewer">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="tip"></div>
        <div id="message"></div>
        <div id="empty" data-app-only hidden>
          <div class="dropzone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 16.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2.5"/><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/>
            </svg>
            <h1 data-i18n="import.drop">Drop a line drawing here</h1>
            <p><button type="button" id="choose" class="primary" data-i18n="import.choose">Choose a file…</button></p>
            <p class="hint" data-i18n="import.paste">You can also paste an image with Ctrl+V.</p>
            <p class="hint" id="import-limits"></p>
          </div>
        </div>
        <div id="convert-bar" data-app-only hidden>
          <div class="convert-row">
            <span data-i18n="convert.as">Write the lines as</span>
            <span class="chips" role="radiogroup" data-i18n-aria-label="convert.as" aria-label="Write the lines as">
              <label class="chip"><input type="radio" name="form" value="function"><span data-i18n="convert.function">functions y = f(x), x = g(y)</span></label>
              <label class="chip"><input type="radio" name="form" value="parametric"><span data-i18n="convert.parametric">parametric equations x(t), y(t)</span></label>
            </span>
            <button type="button" id="convert" class="primary" data-i18n="convert.go">Convert ▶</button>
          </div>
          <div class="convert-row">
            <label class="inline" data-i18n-title="convert.denoiseHint">
              <input type="checkbox" id="denoise-on"><span data-i18n="convert.denoise">Remove noise</span></label>
            <input type="range" id="denoise" min="0" max="100" step="5" data-i18n-aria-label="convert.strengthLabel" data-i18n-title="convert.denoiseHint" aria-label="Noise filter strength">
            <output id="denoise-value" for="denoise"></output>
            <label class="inline" for="faint" data-i18n-title="convert.faintHint"><span data-i18n="convert.faint">Faint lines</span></label>
            <input type="range" id="faint" min="0" max="100" step="5" data-i18n-aria-label="convert.faintLabel" data-i18n-title="convert.faintHint" aria-label="Faint-line sensitivity">
            <output id="faint-value" for="faint"></output>
          </div>
          <p class="hint" id="convert-note"></p>
        </div>
      </div>
      <aside>
        <section id="detail"></section>
        <div id="list"><div id="spacer"></div></div>
      </aside>
    </div>
  </section>
  <div id="running" class="overlay" role="dialog" aria-modal="true" aria-labelledby="run-title" data-app-only hidden>
    <div class="panel">
      <h2 id="run-title" data-i18n="run.title">Converting…</h2>
      <p class="hint" id="run-stage"></p>
      <ol id="steps"></ol>
      <div class="bar"><div class="fill" id="run-bar"></div></div>
      <div class="run-foot">
        <span class="hint" id="elapsed" aria-hidden="true"></span>
        <button type="button" id="cancel" data-i18n="run.cancel">Cancel</button>
      </div>
      <p class="sr-only" id="run-live" aria-live="polite"></p>
    </div>
  </div>
</main>

<input type="file" id="file-input" accept="image/*,.tif,.tiff,.webp,.bmp" hidden>
<div id="drop-overlay" hidden><div data-i18n="drop.release">Release to open the image</div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="fatal" class="overlay" role="alertdialog" aria-labelledby="fatal-title" hidden>
  <div class="panel"><h2 id="fatal-title" data-i18n="fatal.title">line2func has stopped</h2>
    <p data-i18n="error.server_gone">line2func has stopped. You can close this page.</p></div>
</div>
</body>
</html>
